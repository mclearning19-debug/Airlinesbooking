name: Deploy to Azure Container Apps

# Builds the Dockerfile in Azure Container Registry and rolls the Container App
# to the new image. Render deploys separately (its own auto-deploy on push to main).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'render.yaml'
      - '.claude/**'
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: azure-deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: airline-rg
  APP_NAME: airline-booking
  REGISTRY: cad1efcdf2cdacr

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image in ACR
        run: |
          az acr build \
            --registry "$REGISTRY" \
            --image "$APP_NAME:${{ github.sha }}" \
            --image "$APP_NAME:latest" \
            .

      - name: Roll Container App to the new image
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY.azurecr.io/$APP_NAME:${{ github.sha }}" \
            --output none

      - name: Smoke test
        run: |
          FQDN=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 12); do
            if curl -fsS -m 20 "https://$FQDN/api/health" | grep -q '"ok":true'; then
              echo "healthy: https://$FQDN"; exit 0
            fi
            echo "attempt $i: not healthy yet"; sleep 10
          done
          echo "health check failed" >&2; exit 1
